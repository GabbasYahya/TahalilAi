[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tahalilai"
version = "1.0.0"
description = "Privacy-first medical lab report analysis powered by local AI"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GabbasYahya" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    "fpdf2>=2.8.0",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "gTTS>=2.5.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
]

[project.optional-dependencies]
tts-gpu = [
    "qwen-tts",
    "torch",
    "soundfile",
    # qwen-tts 0.1.x requires transformers <5.0 (uses check_model_inputs removed in v5)
    "transformers>=4.40.0,<5.0.0",
    "accelerate",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
tahalilai = "tahalilai.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tahalilai"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tahalilai"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["tahalilai"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "e2e: end-to-end tests requiring external services",
]
