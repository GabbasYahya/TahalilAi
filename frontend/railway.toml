[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"

# NEXT_PUBLIC_API_URL must be a Railway variable on this service.
# It is passed at build time via ARG in the Dockerfile.
[build.args]
NEXT_PUBLIC_API_URL = "${{NEXT_PUBLIC_API_URL}}"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
